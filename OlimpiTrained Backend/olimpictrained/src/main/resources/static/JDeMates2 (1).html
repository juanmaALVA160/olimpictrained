<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemática Divertida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-400 via-pink-500 to-red-500 p-4">
    <div class="max-w-2xl mx-auto" id="gameContainer"></div>

    <script>
        let gameState = 'menu';
        let level = 1;
        let score = 0;
        let lives = 3;
        let timeLeft = 60;
        let currentProblem = null;
        let streak = 0;
        let operation = 'mixed';
        let feedback = '';
        let showFeedback = false;
        let timerInterval = null;

        function generateProblem() {
            const ops = operation === 'mixed' 
                ? ['add', 'subtract', 'multiply', 'divide'] 
                : [operation];
            const selectedOp = ops[Math.floor(Math.random() * ops.length)];
            
            let num1, num2, answer, symbol;
            const maxNum = Math.min(10 + level * 5, 50);
            
            switch (selectedOp) {
                case 'add':
                    num1 = Math.floor(Math.random() * maxNum) + 1;
                    num2 = Math.floor(Math.random() * maxNum) + 1;
                    answer = num1 + num2;
                    symbol = '+';
                    break;
                case 'subtract':
                    num1 = Math.floor(Math.random() * maxNum) + 10;
                    num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                    answer = num1 - num2;
                    symbol = '-';
                    break;
                case 'multiply':
                    num1 = Math.floor(Math.random() * Math.min(10, level + 3)) + 1;
                    num2 = Math.floor(Math.random() * Math.min(10, level + 3)) + 1;
                    answer = num1 * num2;
                    symbol = '×';
                    break;
                case 'divide':
                    answer = Math.floor(Math.random() * 12) + 1;
                    num2 = Math.floor(Math.random() * 9) + 2;
                    num1 = answer * num2;
                    symbol = '÷';
                    break;
            }
            
            return { num1, num2, answer, symbol };
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (gameState === 'playing' && timeLeft > 0) {
                    timeLeft--;
                    updateStats();
                    
                    if (timeLeft === 0) {
                        gameState = 'gameOver';
                        clearInterval(timerInterval);
                        render();
                    }
                }
            }, 1000);
        }

        function updateStats() {
            if (gameState !== 'playing') return;
            
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            document.getElementById('timeDisplay').textContent = timeLeft + 's';
            document.getElementById('livesDisplay').textContent = '❤️'.repeat(lives);
            
            if (streak > 0) {
                document.getElementById('streakDisplay').style.display = 'block';
                document.getElementById('streakNumber').textContent = streak;
            } else {
                document.getElementById('streakDisplay').style.display = 'none';
            }
        }

        function startGame() {
            gameState = 'playing';
            score = 0;
            lives = 3;
            timeLeft = 60;
            streak = 0;
            level = 1;
            feedback = '';
            showFeedback = false;
            currentProblem = generateProblem();
            
            render();
            startTimer();
            
            setTimeout(() => {
                const input = document.getElementById('answerInput');
                if (input) input.focus();
            }, 100);
        }

        function checkAnswer() {
            const input = document.getElementById('answerInput');
            const userAnswer = input.value.trim();
            
            if (!userAnswer || !currentProblem) return;
            
            const answer = parseInt(userAnswer);
            if (isNaN(answer)) return;
            
            if (answer === currentProblem.answer) {
                const points = (10 + streak * 2) * level;
                score += points;
                streak++;
                feedback = `¡Correcto! +${points} puntos`;
                
                if (score >= level * 100) {
                    level++;
                    timeLeft += 10;
                    feedback = `¡Nivel ${level}! +10 segundos bonus`;
                }
            } else {
                lives--;
                streak = 0;
                feedback = `Incorrecto. La respuesta era ${currentProblem.answer}`;
                
                if (lives <= 0) {
                    gameState = 'gameOver';
                    clearInterval(timerInterval);
                    render();
                    return;
                }
            }
            
            showFeedbackMessage();
            
            setTimeout(() => {
                currentProblem = generateProblem();
                input.value = '';
                hideFeedback();
                updateProblem();
                updateStats();
                input.focus();
            }, 1500);
        }

        function showFeedbackMessage() {
            const feedbackDiv = document.getElementById('feedbackMessage');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const feedbackText = document.getElementById('feedbackText');
            
            feedbackIcon.textContent = feedback.includes('Correcto') ? '🎉' : '😅';
            feedbackText.textContent = feedback;
            feedbackDiv.style.display = 'flex';
        }

        function hideFeedback() {
            const feedbackDiv = document.getElementById('feedbackMessage');
            feedbackDiv.style.display = 'none';
        }

        function updateProblem() {
            if (currentProblem) {
                document.getElementById('problemDisplay').textContent = 
                    `${currentProblem.num1} ${currentProblem.symbol} ${currentProblem.num2} = ?`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                checkAnswer();
            }
        }

        function changeOperation(value) {
            operation = value;
        }

        function render() {
            const container = document.getElementById('gameContainer');
            
            if (gameState === 'menu') {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-2xl p-8 text-center transform hover:scale-105 transition-transform">
                        <h1 class="text-6xl font-bold text-purple-600 mb-4 animate-bounce">🧮</h1>
                        <h2 class="text-4xl font-bold text-gray-800 mb-6">Matemática Divertida</h2>
                        <p class="text-xl text-gray-600 mb-8">¡Resuelve problemas y gana puntos!</p>
                        
                        <div class="mb-6">
                            <label class="block text-lg font-semibold text-gray-700 mb-2">Tipo de operación:</label>
                            <select
                                id="operationSelect"
                                onchange="changeOperation(this.value)"
                                class="bg-gray-100 border-2 border-purple-300 rounded-xl px-4 py-2 text-lg focus:border-purple-500 focus:outline-none"
                            >
                                <option value="mixed">Mezclado</option>
                                <option value="add">Solo Suma</option>
                                <option value="subtract">Solo Resta</option>
                                <option value="multiply">Solo Multiplicación</option>
                                <option value="divide">Solo División</option>
                            </select>
                        </div>
                        
                        <button
                            onclick="startGame()"
                            class="bg-gradient-to-r from-purple-500 to-pink-500 text-white text-2xl font-bold py-4 px-8 rounded-2xl hover:from-purple-600 hover:to-pink-600 transform hover:scale-105 transition-all shadow-lg"
                        >
                            ▶️ ¡Empezar Juego!
                        </button>
                    </div>
                `;
            } else if (gameState === 'playing') {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-2xl p-8">
                        <div class="flex justify-between items-center mb-8">
                            <div class="bg-blue-100 rounded-2xl px-4 py-2">
                                <div class="text-sm text-blue-600">Puntos</div>
                                <div class="text-2xl font-bold text-blue-800" id="scoreDisplay">${score}</div>
                            </div>
                            <div class="bg-green-100 rounded-2xl px-4 py-2">
                                <div class="text-sm text-green-600">Nivel</div>
                                <div class="text-2xl font-bold text-green-800" id="levelDisplay">${level}</div>
                            </div>
                            <div class="bg-yellow-100 rounded-2xl px-4 py-2">
                                <div class="text-sm text-yellow-600">Tiempo</div>
                                <div class="text-2xl font-bold text-yellow-800" id="timeDisplay">${timeLeft}s</div>
                            </div>
                            <div class="flex space-x-1">
                                <div class="text-2xl" id="livesDisplay">${'❤️'.repeat(lives)}</div>
                            </div>
                        </div>

                        <div class="text-center mb-4" id="streakDisplay" style="display: ${streak > 0 ? 'block' : 'none'}">
                            <div class="inline-flex items-center bg-orange-100 rounded-full px-4 py-2">
                                <span class="text-orange-500 mr-2">⭐</span>
                                <span class="text-orange-700 font-semibold">Racha: <span id="streakNumber">${streak}</span></span>
                            </div>
                        </div>

                        <div class="text-center mb-8">
                            <div class="bg-gray-50 rounded-3xl p-8 mb-6">
                                <div class="text-6xl font-bold text-gray-800 mb-4" id="problemDisplay">
                                    ${currentProblem.num1} ${currentProblem.symbol} ${currentProblem.num2} = ?
                                </div>
                            </div>

                            <input
                                type="text"
                                id="answerInput"
                                onkeypress="handleKeyPress(event)"
                                class="text-4xl font-bold text-center bg-blue-50 border-4 border-blue-300 rounded-2xl p-4 w-48 focus:border-blue-500 focus:outline-none"
                                placeholder="?"
                                autocomplete="off"
                            />

                            <div class="mt-6">
                                <button
                                    onclick="checkAnswer()"
                                    class="bg-gradient-to-r from-green-500 to-blue-500 text-white text-xl font-bold py-3 px-8 rounded-2xl hover:from-green-600 hover:to-blue-600 transform hover:scale-105 transition-all"
                                >
                                    Verificar Respuesta
                                </button>
                            </div>
                        </div>

                        <div id="feedbackMessage" class="fixed inset-0 flex items-center justify-center z-50 pointer-events-none" style="display: none;">
                            <div class="bg-white rounded-3xl shadow-2xl p-8 text-center transform scale-110 animate-pulse">
                                <div class="text-4xl mb-4" id="feedbackIcon">🎉</div>
                                <div class="text-2xl font-bold text-gray-800" id="feedbackText"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (gameState === 'gameOver') {
                const emoji = score >= 500 ? '🏆' : score >= 200 ? '🌟' : '🎯';
                const message = score >= 500 
                    ? '¡Excelente! Eres un genio matemático 🧠'
                    : score >= 200 
                    ? '¡Muy bien! Sigue practicando 📚'
                    : '¡Buen intento! La práctica hace al maestro 💪';
                const messageColor = score >= 500 
                    ? 'text-green-600' 
                    : score >= 200 
                    ? 'text-blue-600' 
                    : 'text-orange-600';
                
                container.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-2xl p-8 text-center">
                        <div class="text-6xl mb-4">${emoji}</div>
                        <h2 class="text-4xl font-bold text-gray-800 mb-4">¡Juego Terminado!</h2>
                        
                        <div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-6 mb-6">
                            <div class="text-2xl font-bold text-purple-800 mb-2">Puntuación Final</div>
                            <div class="text-5xl font-bold text-purple-900">${score}</div>
                            <div class="text-lg text-purple-700 mt-2">Nivel alcanzado: ${level}</div>
                        </div>

                        <div class="mb-6">
                            <div class="text-xl ${messageColor} font-semibold">${message}</div>
                        </div>

                        <button
                            onclick="startGame()"
                            class="bg-gradient-to-r from-green-500 to-blue-500 text-white text-2xl font-bold py-4 px-8 rounded-2xl hover:from-green-600 hover:to-blue-600 transform hover:scale-105 transition-all shadow-lg"
                        >
                            🔄 Jugar de Nuevo
                        </button>
                    </div>
                `;
            }
        }

        // Initialize
        render();
    </script>
</body>
</html>
