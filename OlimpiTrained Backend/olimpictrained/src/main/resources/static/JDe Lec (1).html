<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras Literarias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #2a2a3e;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #3a3a4e;
        }
        .header {
            background: linear-gradient(135deg, #4a4a5e 0%, #5a5a6e 100%);
            padding: 30px;
            text-align: center;
            color: #f0f0f0;
            border-bottom: 2px solid #6a6a7e;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .header p {
            color: #b0b0c0;
        }
        .score-board {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            background: #1f1f2e;
            border-bottom: 3px solid #3a3a4e;
        }
        .score-item {
            text-align: center;
        }
        .score-label {
            font-size: 0.9em;
            color: #888899;
            margin-bottom: 5px;
        }
        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #7d8cc4;
        }
        .game-area {
            padding: 30px;
        }
        .text-box {
            background: #1f1f2e;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #7d8cc4;
            line-height: 1.8;
            font-size: 1.1em;
            color: #d0d0e0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .question-box {
            background: linear-gradient(135deg, #3a3a4e 0%, #4a4a5e 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid #5a5a6e;
        }
        .question-box h3 {
            color: #a0a0d0;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .question-box p {
            color: #d0d0e0;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #4a4a5e;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
            background: #1f1f2e;
            color: #e0e0e0;
        }
        textarea:focus {
            outline: none;
            border-color: #7d8cc4;
            box-shadow: 0 0 10px rgba(125, 140, 196, 0.3);
        }
        textarea::placeholder {
            color: #666677;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.9em;
            color: #888899;
        }
        .error-highlight {
            background: rgba(255, 100, 100, 0.2);
            border-bottom: 2px wavy #ff6464;
            cursor: help;
        }
        .spelling-panel {
            background: #3a2a2a;
            border: 2px solid #7a4a4a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .spelling-panel.active {
            display: block;
            animation: slideIn 0.3s;
        }
        .spelling-error {
            margin: 10px 0;
            padding: 10px;
            background: #2a1a1a;
            border-radius: 5px;
            border-left: 3px solid #ff6464;
        }
        .spelling-error strong {
            color: #ff9494;
        }
        .suggestion {
            display: inline-block;
            background: #4a4a5e;
            padding: 5px 10px;
            margin: 5px 5px 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .suggestion:hover {
            background: #5a5a6e;
            transform: scale(1.05);
        }
        .improvement-tips {
            background: #2a3a2a;
            border: 2px solid #4a7a4a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        .improvement-tips.active {
            display: block;
            animation: slideIn 0.3s;
        }
        .tip-item {
            margin: 8px 0;
            padding-left: 20px;
            position: relative;
            color: #b0e0b0;
        }
        .tip-item:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #6a9a6a;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6a7099 0%, #7d8cc4 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(125, 140, 196, 0.4);
            background: linear-gradient(135deg, #7d8cc4 0%, #8d9cd4 100%);
        }
        .btn-secondary {
            background: #4a4a5e;
            color: #d0d0e0;
            border: 1px solid #5a5a6e;
        }
        .btn-secondary:hover {
            background: #5a5a6e;
        }
        .btn-check {
            background: linear-gradient(135deg, #7a6a4a 0%, #9a8a6a 100%);
            color: white;
        }
        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(154, 138, 106, 0.4);
        }
        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.5s;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .feedback.success {
            background: #2a3a2a;
            border: 2px solid #4a7a4a;
            color: #b0e0b0;
        }
        .feedback.info {
            background: #2a2a3a;
            border: 2px solid #4a4a7a;
            color: #b0b0e0;
        }
        .tips {
            background: #3a3a2a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border-left: 4px solid #8a8a4a;
            color: #d0d0a0;
        }
        .tips strong {
            color: #e0e0b0;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #1f1f2e;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #3a3a4e;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6a7099 0%, #7d8cc4 100%);
            transition: width 0.5s;
            box-shadow: 0 0 10px rgba(125, 140, 196, 0.5);
        }
        .celebration {
            text-align: center;
            padding: 40px;
            display: none;
        }
        .celebration.active {
            display: block;
            animation: bounceIn 0.8s;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .celebration-emoji {
            font-size: 5em;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(125, 140, 196, 0.5));
        }
        .celebration h2 {
            color: #b0b0d0;
        }
        .celebration p {
            color: #a0a0c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Aventuras Literarias</h1>
            <p>Desarrolla tu creatividad mientras lees y escribes</p>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">🎯 Nivel</div>
                <div class="score-value" id="level">1</div>
            </div>
            <div class="score-item">
                <div class="score-label">⭐ Puntos</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">📝 Completados</div>
                <div class="score-value" id="completed">0</div>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="text-box" id="textBox"></div>
            
            <div class="question-box">
                <h3 id="questionTitle">🤔 Pregunta:</h3>
                <p id="questionText"></p>
                <div class="tips" id="tips"></div>
            </div>

            <textarea id="answerInput" placeholder="Escribe tu respuesta aquí... ¡Sé creativo!"></textarea>
            <div class="stats-row">
                <span>Palabras: <strong id="wordCount">0</strong></span>
                <span>Caracteres: <strong id="charCount">0</strong></span>
                <span>Oraciones: <strong id="sentenceCount">0</strong></span>
            </div>

            <div class="spelling-panel" id="spellingPanel"></div>
            <div class="improvement-tips" id="improvementTips"></div>
            <div class="feedback" id="feedback"></div>

            <div class="btn-container">
                <button class="btn-secondary" onclick="skipChallenge()">⏭️ Saltar</button>
                <button class="btn-check" onclick="checkText()">🔍 Revisar Texto</button>
                <button class="btn-primary" onclick="submitAnswer()">✨ Enviar Respuesta</button>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="celebration" id="celebration">
            <div class="celebration-emoji">🎉</div>
            <h2>¡Felicitaciones!</h2>
            <p style="font-size: 1.2em; margin: 20px 0;">Has completado todos los desafíos del nivel <span id="completedLevel"></span></p>
            <button class="btn-primary" onclick="nextLevel()">🚀 Siguiente Nivel</button>
        </div>
    </div>

    <script>
        // Generador de historias aleatorias
        const storyElements = {
            personajes: ['Luna', 'Sebastián', 'Marina', 'Dr. Ramírez', 'Elena', 'Carlos', 'Sofia', 'Miguel', 'Ana', 'Diego'],
            escenarios: [
                'en un pequeño pueblo al pie de las montañas',
                'en una ciudad futurista del año 2150',
                'en un antiguo castillo abandonado',
                'en una isla misteriosa perdida en el océano',
                'en un laboratorio secreto',
                'en un bosque encantado',
                'en una biblioteca mágica',
                'en las profundidades del mar',
                'en una estación espacial',
                'en un mercado de antiguedades'
            ],
            poderes: [
                'podía hablar con los animales',
                'tenía la habilidad de ver el futuro',
                'podía convertir sus sueños en realidad',
                'descubrió que podía viajar en el tiempo',
                'encontró un objeto mágico que le concedía un deseo',
                'desarrolló la capacidad de leer pensamientos',
                'descubrió un portal a otra dimensión',
                'aprendió a controlar los elementos de la naturaleza',
                'encontró un antiguo libro de hechizos',
                'descubrió que tenía un don heredado de sus ancestros'
            ],
            conflictos: [
                'pero un día todo cambió cuando descubrió un secreto oscuro',
                'hasta que una misteriosa profecía amenazó con destruirlo todo',
                'cuando una fuerza desconocida comenzó a alterar la realidad',
                'pero pronto se dio cuenta de que alguien lo estaba siguiendo',
                'hasta que encontró una carta que revelaba una verdad impactante',
                'cuando un extraño visitante llegó con una advertencia urgente',
                'pero descubrió que su don tenía un precio inesperado',
                'hasta que un antiguo enemigo resurgió del pasado',
                'cuando encontró evidencia de que nada era lo que parecía',
                'pero una decisión del pasado volvió para perseguirlo'
            ],
            objetos: [
                'un antiguo medallón brillante',
                'un mapa misterioso con símbolos extraños',
                'una llave de oro con inscripciones desconocidas',
                'un libro encuadernado en cuero desgastado',
                'una brújula que no apuntaba al norte',
                'un espejo que mostraba reflejos del pasado',
                'una caja musical que tocaba melodías olvidadas',
                'un reloj de bolsillo que se movía hacia atrás',
                'una fotografía antigua que cambiaba de imagen',
                'un cristal que brillaba con luz propia'
            ]
        };

        const questionTypes = [
            {
                template: "¿Qué crees que motivó a {personaje} a {accion}? Explora sus emociones y razones.",
                tip: "Profundiza en la psicología del personaje, sus miedos y esperanzas..."
            },
            {
                template: "Continúa la historia: ¿Qué sucede cuando {personaje} descubre la verdad sobre {elemento}?",
                tip: "Describe la escena con detalles sensoriales: lo que ve, escucha, siente..."
            },
            {
                template: "Crea un diálogo entre {personaje} y un personaje nuevo que aparece en este momento crítico.",
                tip: "Dale personalidad única a cada personaje. Usa su tono y manera de hablar..."
            },
            {
                template: "Si tú fueras {personaje}, ¿qué decisión tomarías y por qué? Justifica tu respuesta.",
                tip: "Considera las consecuencias a corto y largo plazo de tus decisiones..."
            },
            {
                template: "Describe el momento más importante de esta historia desde la perspectiva de otro personaje.",
                tip: "Cambia el punto de vista completamente. ¿Cómo lo vería alguien más?"
            },
            {
                template: "¿Qué simboliza {elemento} en esta historia? Analiza su significado profundo.",
                tip: "Piensa en metáforas, temas universales y conexiones emocionales..."
            },
            {
                template: "Escribe el final alternativo de esta historia: ¿Qué pasaría si {personaje} eligiera otro camino?",
                tip: "Explora las consecuencias de decisiones diferentes. ¡Sé creativo!"
            },
            {
                template: "Imagina el pasado de {personaje}. ¿Qué evento de su infancia explica sus acciones actuales?",
                tip: "Crea una historia de origen convincente que conecte con el presente..."
            }
        ];

        // Diccionario de errores comunes en español
        const commonErrors = {
            'aver': 'a ver',
            'haber': 'a ver (cuando va antes de "si")',
            'halla': 'haya (del verbo haber)',
            'aya': 'haya',
            'valla': 'vaya (del verbo ir)',
            'tubo': 'tuvo (del verbo tener)',
            'estubo': 'estuvo',
            'iva': 'iba',
            'hiva': 'iba',
            'iso': 'hizo',
            'hiso': 'hizo',
            'haora': 'ahora',
            'aserca': 'acerca',
            'haci': 'así',
            'asta': 'hasta',
            'ablando': 'hablando',
            'ablo': 'hablo (o habló)',
            'deves': 'debes',
            'deveria': 'debería',
            'huviera': 'hubiera',
            'hubiese': 'hubiese',
            'asia': 'hacía',
            'aun': 'aún (cuando significa todavía)',
            'mas': 'más (cuando es cantidad)',
            'solo': 'sólo (cuando significa solamente)',
            'porke': 'porque',
            'xq': 'porque',
            'q': 'que',
            'bn': 'bien',
            'tbn': 'también',
            'tambien': 'también'
        };

        let currentStory = '';
        let currentQuestion = '';
        let currentTip = '';
        let usedStories = [];
        let score = 0;
        let level = 1;
        let completed = 0;
        let answersInLevel = 0;

        function generateRandomStory() {
            const personaje = storyElements.personajes[Math.floor(Math.random() * storyElements.personajes.length)];
            const escenario = storyElements.escenarios[Math.floor(Math.random() * storyElements.escenarios.length)];
            const poder = storyElements.poderes[Math.floor(Math.random() * storyElements.poderes.length)];
            const conflicto = storyElements.conflictos[Math.floor(Math.random() * storyElements.conflictos.length)];
            const objeto = storyElements.objetos[Math.floor(Math.random() * storyElements.objetos.length)];

            const story = `${personaje} vivía ${escenario}, donde ${poder}. ${conflicto}. Un día, mientras exploraba, encontró ${objeto} que cambiaría su destino para siempre.`;
            
            // Verificar que no se repita
            if (usedStories.includes(story)) {
                return generateRandomStory();
            }
            
            usedStories.push(story);
            if (usedStories.length > 20) {
                usedStories.shift(); // Mantener solo las últimas 20
            }

            return { story, personaje, objeto };
        }

        function generateRandomQuestion(personaje, objeto) {
            const questionType = questionTypes[Math.floor(Math.random() * questionTypes.length)];
            const actions = ['tomar esta decisión', 'emprender este viaje', 'buscar la verdad', 'enfrentar sus miedos', 'seguir adelante'];
            const action = actions[Math.floor(Math.random() * actions.length)];

            const question = questionType.template
                .replace('{personaje}', personaje)
                .replace('{accion}', action)
                .replace('{elemento}', objeto);

            return { question, tip: questionType.tip };
        }

        function loadChallenge() {
            const { story, personaje, objeto } = generateRandomStory();
            const { question, tip } = generateRandomQuestion(personaje, objeto);

            currentStory = story;
            currentQuestion = question;
            currentTip = tip;

            document.getElementById('textBox').textContent = story;
            document.getElementById('questionText').textContent = question;
            document.getElementById('tips').innerHTML = `<strong>💡 Consejo:</strong> ${tip}`;
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('spellingPanel').classList.remove('active');
            document.getElementById('improvementTips').classList.remove('active');
            updateStats();
            updateProgress();
        }

        function updateProgress() {
            const questionsInLevel = 5;
            const currentProgress = (answersInLevel / questionsInLevel) * 100;
            document.getElementById('progressBar').style.width = currentProgress + '%';
        }

        function updateStats() {
            const text = document.getElementById('answerInput').value.trim();
            const words = text.split(/\s+/).filter(w => w.length > 0);
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            document.getElementById('wordCount').textContent = words.length;
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('sentenceCount').textContent = sentences.length;
        }

        document.getElementById('answerInput').addEventListener('input', updateStats);

        function checkText() {
            const text = document.getElementById('answerInput').value.trim();
            const words = text.split(/\s+/).filter(w => w.length > 0);

            if (words.length < 5) {
                alert('Escribe al menos 5 palabras para poder revisar tu texto.');
                return;
            }

            // Detectar errores ortográficos
            const errors = [];
            const textLower = text.toLowerCase();
            
            for (const [error, correction] of Object.entries(commonErrors)) {
                const regex = new RegExp('\\b' + error + '\\b', 'gi');
                if (regex.test(textLower)) {
                    errors.push({ error, correction });
                }
            }

            // Mostrar errores ortográficos
            const spellingPanel = document.getElementById('spellingPanel');
            if (errors.length > 0) {
                let html = '<h4 style="color: #ff9494; margin-bottom: 10px;">📝 Errores ortográficos detectados:</h4>';
                errors.forEach(err => {
                    html += `
                        <div class="spelling-error">
                            <strong>"${err.error}"</strong> debería ser: 
                            <span class="suggestion" onclick="replaceWord('${err.error}', '${err.correction}')">${err.correction}</span>
                        </div>
                    `;
                });
                spellingPanel.innerHTML = html;
                spellingPanel.classList.add('active');
            } else {
                spellingPanel.innerHTML = '<p style="color: #b0e0b0;">✅ ¡No se detectaron errores ortográficos comunes!</p>';
                spellingPanel.classList.add('active');
            }

            // Generar pautas de mejora
            const tips = generateImprovementTips(text, words);
            const tipsPanel = document.getElementById('improvementTips');
            
            let tipsHtml = '<h4 style="color: #b0e0b0; margin-bottom: 10px;">💡 Pautas para mejorar:</h4>';
            tips.forEach(tip => {
                tipsHtml += `<div class="tip-item">${tip}</div>`;
            });
            tipsPanel.innerHTML = tipsHtml;
            tipsPanel.classList.add('active');
        }

        function replaceWord(oldWord, newWord) {
            const textarea = document.getElementById('answerInput');
            const regex = new RegExp('\\b' + oldWord + '\\b', 'gi');
            textarea.value = textarea.value.replace(regex, newWord);
            updateStats();
            checkText(); // Revisar de nuevo
        }

        function generateImprovementTips(text, words) {
            const tips = [];
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);

            // Longitud de respuesta
            if (words.length < 20) {
                tips.push('Intenta desarrollar más tus ideas. Añade detalles, ejemplos o explicaciones.');
            } else if (words.length > 100) {
                tips.push('Excelente extensión. Asegúrate de que todas tus ideas estén bien conectadas.');
            }

            // Variedad de oraciones
            if (sentences.length > 0) {
                const avgWordsPerSentence = words.length / sentences.length;
                if (avgWordsPerSentence < 5) {
                    tips.push('Tus oraciones son muy cortas. Intenta combinar algunas ideas relacionadas.');
                } else if (avgWordsPerSentence > 30) {
                    tips.push('Algunas oraciones son muy largas. Considera dividirlas para mayor claridad.');
                }
            }

            // Uso de puntuación
            if (!/[,;:]/.test(text)) {
                tips.push('Usa signos de puntuación (comas, punto y coma) para mejorar la fluidez.');
            }

            // Palabras repetidas
            const wordFreq = {};
            words.forEach(w => {
                const word = w.toLowerCase().replace(/[^\w]/g, '');
                if (word.length > 4) {
                    wordFreq[word] = (wordFreq[word] || 0) + 1;
                }
            });
            const repeated = Object.entries(wordFreq).filter(([w, count]) => count > 3);
            if (repeated.length > 0) {
                tips.push(`Evita repetir palabras como: ${repeated.map(([w]) => w).join(', ')}. Usa sinónimos.`);
            }

            // Conectores
            const connectors = ['además', 'sin embargo', 'por lo tanto', 'mientras que', 'aunque', 'porque', 'entonces'];
            const hasConnectors = connectors.some(c => text.toLowerCase().includes(c));
            if (!hasConnectors && words.length > 30) {
                tips.push('Usa conectores (además, sin embargo, por lo tanto) para enlazar tus ideas.');
            }

            // Adjetivos descriptivos
            const adjectives = text.match(/\b(hermoso|grande|pequeño|bueno|malo|interesante|increíble|misterioso|antiguo)\b/gi);
            if (adjectives && adjectives.length > 0) {
                tips.push('¡Buen uso de adjetivos! Sigue añadiendo descripciones vívidas.');
            } else if (words.length > 20) {
                tips.push('Añade más adjetivos descriptivos para hacer tu texto más vívido.');
            }

            if (tips.length === 0) {
                tips.push('¡Excelente trabajo! Tu texto está bien estructurado y es claro.');
            }

            return tips;
        }

        function submitAnswer() {
            const answer = document.getElementById('answerInput').value.trim();
            const words = answer.split(/\s+/).filter(w => w.length > 0);
            const feedback = document.getElementById('feedback');

            if (words.length < 10) {
                feedback.className = 'feedback info';
                feedback.innerHTML = '📝 <strong>¡Puedes hacerlo mejor!</strong><br>Intenta desarrollar más tu respuesta. Se requieren al menos 10 palabras para mostrar tu creatividad.';
                feedback.style.display = 'block';
                return;
            }

            // Calcular puntos basados en calidad
            let points = Math.min(words.length * 2, 100);
            
            // Bonus por uso de conectores
            const connectors = ['además', 'sin embargo', 'por lo tanto', 'mientras que', 'aunque', 'porque'];
            const connectorsUsed = connectors.filter(c => answer.toLowerCase().includes(c)).length;
            points += connectorsUsed * 5;

            // Bonus por variedad de oraciones
            const sentences = answer.split(/[.!?]+/).filter(s => s.trim().length > 0);
            if (sentences.length >= 3) points += 10;

            score += points;
            completed++;
            answersInLevel++;

            document.getElementById('score').textContent = score;
            document.getElementById('completed').textContent = completed;

            feedback.className = 'feedback success';
            feedback.innerHTML = `
                🎉 <strong>¡Excelente trabajo!</strong><br>
                Has ganado ${points} puntos. Tu respuesta muestra creatividad y reflexión.
                <br><br>
                <em>"${answer.substring(0, 100)}${answer.length > 100 ? '...' : ''}"</em>
            `;
            feedback.style.display = 'block';

            setTimeout(() => {
                moveToNext();
            }, 3000);
        }

        function skipChallenge() {
            moveToNext();
        }

        function moveToNext() {
            if (answersInLevel >= 5) {
                showLevelComplete();
                return;
            }

            loadChallenge();
        }

        function showLevelComplete() {
            document.getElementById('completedLevel').textContent = level;
            document.getElementById('celebration').classList.add('active');
            document.getElementById('gameArea').style.display = 'none';
        }

        function nextLevel() {
            level++;
            answersInLevel = 0;
            document.getElementById('level').textContent = level;
            document.getElementById('celebration').classList.remove('active');
            document.getElementById('gameArea').style.display = 'block';
            loadChallenge();
        }

        loadChallenge();
    </script>
</body>
</html>
